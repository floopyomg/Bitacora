<title>Bitácora</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bitácora: control de horas, rentabilidad y cobros por cliente para autónomos.">
<style>
/* Layout: app de una columna centrada (máx. 760px) con barra de pestañas inferior en móvil y barra lateral en escritorio. Estética sobria tipo iOS: superficies planas, bordes finos, el color solo en los clientes. */
:root{
  --bg:#f4f4f6; --surface:#ffffff; --fg:#1c1c1f; --muted:#6c6c72; --faint:#a9a9b0;
  --line:#dcdce1; --fill:#ebebef; --accent:#1c1c1f; --on-accent:#ffffff;
  --good:#1d8348; --warn:#a85f00; --bad:#c4362b; --scrim:rgba(20,20,24,.38);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,Roboto,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --fg:#f2f2f5; --muted:#9a9aa1; --faint:#5f5f66;
  --line:#353538; --fill:#2a2a2d; --accent:#f2f2f5; --on-accent:#000000;
  --good:#3ccf6e; --warn:#ffb340; --bad:#ff6b61; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fg:#f2f2f5; --muted:#9a9aa1; --faint:#5f5f66;
  --line:#353538; --fill:#2a2a2d; --accent:#f2f2f5; --on-accent:#000000;
  --good:#3ccf6e; --warn:#ffb340; --bad:#ff6b61; --scrim:rgba(0,0,0,.6); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--font-display);text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.app{display:flex;min-height:100%}
.side{display:none}
main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
.side .brand{font:700 20px/1 var(--font-display);padding:6px 12px 18px;letter-spacing:-.01em}
.side .tab{flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;justify-content:flex-start}
.side .tab[aria-current="page"]{background:var(--fill)}
.side .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--muted)}
@media (min-width:900px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:2px;width:228px;flex:none;position:sticky;top:0;height:100vh;padding:24px 12px;border-right:1px solid var(--line);background:var(--surface)}
  main{padding-block:32px 56px}
}

/* cabecera */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.top .sub{color:var(--muted);font-size:14px;margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.iconbtn svg{width:19px;height:19px}
.streak{font-size:13px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}

/* elementos base */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;font-family:var(--font)}
.sec-h .aside{font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .x{opacity:.6;font-size:15px;line-height:1}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--fill);color:var(--muted);white-space:nowrap}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}

input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.f > span{display:flex;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}

/* listas tipo Ajustes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
button.row{appearance:none;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.list > button.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.em{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));font-size:19px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:16px;text-align:center}

/* objetivo semanal */
.goal{display:flex;flex-direction:column;gap:10px}
.goal .big{font:600 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.goal .big small{font-size:15px;font-weight:500;color:var(--muted);margin-left:4px}
.meter{height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.meter > i{display:block;height:100%;border-radius:999px;background:var(--fg);transition:width .4s ease}
.meter.done > i{background:var(--good)}

/* avisos */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.alert .e{font-size:18px;line-height:1.3}
.alert .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}

/* cronómetro */
.timer{border-radius:20px;padding:18px 18px 16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:14px}
.timer.on{background:color-mix(in srgb,var(--c) 11%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.timer .who{display:flex;align-items:center;gap:10px;min-width:0}
.timer .who .nm{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font:600 clamp(52px,15vw,76px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.timer.paused .clock{color:var(--muted)}
.timer.idle{align-items:flex-start}
.timer.idle .clock{color:var(--faint)}
.timer .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.timer.pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.975);opacity:.55}to{transform:none;opacity:1}}

/* botones de cliente */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px}
.cbtn{appearance:none;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;min-height:62px;min-width:0;position:relative}
.cbtn .txt{min-width:0;display:flex;flex-direction:column}
.cbtn .nm{font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cbtn .t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cbtn.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.cbtn.add{justify-content:center;color:var(--muted);border-style:dashed;background:transparent}
.cbtn kbd{position:absolute;top:6px;right:8px;font:11px var(--font);color:var(--faint);display:none}
@media (hover:hover) and (min-width:900px){.cbtn kbd{display:block}}
.cbtn.flash{animation:flash .5s ease}
@keyframes flash{50%{background:color-mix(in srgb,var(--c) 22%,var(--surface))}}

/* barra mini del cronómetro en otras pestañas */
.mini{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.mini .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* informes */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font:600 22px/1.15 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.delta{font-size:12px;font-weight:600;color:var(--muted)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline}
.brow .lb{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;font-weight:500}
.brow .lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .vl{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .vl b{color:var(--fg);font-weight:600}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--c,var(--fg))}
.tbl-wrap{overflow-x:auto}
table.rank{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.rank th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:0 8px 8px;white-space:nowrap}
table.rank th:first-child,table.rank td:first-child{text-align:left;padding-left:0}
table.rank td{padding:10px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.rank td:first-child{white-space:normal;min-width:140px}
table.rank .cn{display:flex;align-items:center;gap:8px;font-weight:600}
table.rank .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--font)}
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px}
.heat i{border-radius:3px;background:var(--fill)}
.heat i.l1{background:color-mix(in srgb,var(--fg) 22%,var(--fill))}
.heat i.l2{background:color-mix(in srgb,var(--fg) 45%,var(--fill))}
.heat i.l3{background:color-mix(in srgb,var(--fg) 68%,var(--fill))}
.heat i.l4{background:var(--fg)}
.heat i.hol{background:transparent;border:1px dashed var(--line)}
.heat i.out{background:transparent}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.period{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.period .nav{display:flex;align-items:center;gap:6px}
.period .lbl{font-weight:600;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.ai-out{white-space:normal;font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:8px}
.ai-out ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* hojas */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:18px;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .24s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.sheet{border-radius:20px;padding:22px 24px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h3{font-size:19px;font-weight:700}
.sheet .fields{display:flex;flex-direction:column;gap:16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;appearance:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1}
.check{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:var(--fg);font-weight:500}
.switch{appearance:none;width:46px;height:28px;border-radius:999px;background:var(--fill);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s ease}
.switch:checked{background:var(--good);border-color:var(--good)}
.switch:checked::after{left:20px}

/* aviso flotante */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 10px 10px 18px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);font-size:14px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:up .2s ease}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent);padding:5px 12px}
@media (min-width:900px){.toast{bottom:28px}}
.hint{font-size:12px;color:var(--muted);text-align:center}
.demo{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px;padding:10px 14px;border-radius:var(--radius);border:1px dashed var(--line)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <nav class="side" aria-label="Secciones">
    <div class="brand">Bitácora</div>
    <div id="sidetabs"></div>
    <div class="foot" id="sidefoot"></div>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
<div id="sheet"></div>
<div id="toast" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
"use strict";

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => addDays(d, -((d.getDay() + 6) % 7));
const daysInMonth = d => new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
const todayKey = () => dkey(new Date());
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : null; };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const fDay = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" });
const fShort = new Intl.DateTimeFormat("es-ES", { weekday: "short", day: "numeric" });
const fDM = new Intl.DateTimeFormat("es-ES", { day: "numeric", month: "short" });
const fMonth = new Intl.DateTimeFormat("es-ES", { month: "long", year: "numeric" });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
let eurFmt0, eurFmt2;
try {
  eurFmt0 = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 0, useGrouping: "always" });
  eurFmt2 = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: "always" });
} catch { eurFmt0 = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }); eurFmt2 = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" }); }
const eur = (n, dec) => S.hide ? "•••• €" : (dec || (Math.abs(n) < 100 && n % 1 !== 0) ? eurFmt2 : eurFmt0).format(n || 0);
const eurH = n => S.hide ? "•• €/h" : (n == null ? "—" : `${Math.round(n)} €/h`);
function dur(mins) {

  let out = "", inList = false;
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  for (const l of lines) {
    const m = l.match(/^([-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${fmt(m[2])}</li>`; }

  const W = 600, H = 190, L = 30, B = 22, T = 8, bw = (W - L) / 12;

  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas facturables por semana, últimas 12 semanas">`;
  for (const tk of ticks) s += `<line x1="${L}" x2="${W}" y1="${y(tk)}" y2="${y(tk)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(tk) + 4}" text-anchor="end">${tk}</text>`;
  weeks.forEach((w, i) => {
    const x = L + i * bw + bw * 0.18, bh = Math.max(0, y(0) - y(w.v));
    s += `<rect x="${x}" y="${y(w.v)}" width="${bw * 0.64}" height="${bh}" rx="4" fill="${i === 11 ? "var(--fg)" : "var(--faint)"}"><title>Semana del ${fDM.format(w.s)}: ${durShort(w.v * 60)}</title></rect>`;
    if (i % 2 === 1 || i === 11) s += `<text x="${x + bw * 0.32}" y="${H - 6}" text-anchor="middle">${fDM.format(w.s).replace(".", "")}</text>`;
  });
  if (goal) s += `<line x1="${L}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W - 2}" y="${y(goal) - 5}" text-anchor="end" style="fill:var(--good)">objetivo ${goal} h</text>`;
  return s + "</svg>";
}
function heatmap() {
  const end = addDays(startOfWeek(new Date()), 6), start = addDays(startOfWeek(new Date()), -7 * 17);
  const m = {}; timeEntries().forEach(e => { m[e.date] = (m[e.date] || 0) + e.mins; });
  let cells = "";
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const k = dkey(d), v = (m[k] || 0) / 60;
    const cls = k > todayKey() ? "out" : v === 0 ? (isOff(k) ? "hol" : "") : v < 2 ? "l1" : v < 4 ? "l2" : v < 6 ? "l3" : "l4";
    cells += `<i class="${cls}" title="${esc(fShort.format(d))}: ${v ? durShort(v * 60) : "nada"}"></i>`;
  }
  return `<div class="heat-wrap"><div class="heat" role="img" aria-label="Horas trabajadas por día">${cells}</div></div>
    <div class="legend">Menos <i style="background:var(--fill)"></i><i class="l1" style="background:color-mix(in srgb,var(--fg) 22%,var(--fill))"></i><i style="background:color-mix(in srgb,var(--fg) 45%,var(--fill))"></i><i style="background:color-mix(in srgb,var(--fg) 68%,var(--fill))"></i><i style="background:var(--fg)"></i> Más · 6 h o más</div>`;
}
const BILL = ["pendiente", "facturado", "cobrado"];
function billingHtml(f, C) {
  const cl = clientsById(), ym = f.slice(0, 7);

  if (!rows.length) return "";
  let pend = 0;
  const html = rows.map(p => {
    const c = cl[p.id], k = `${p.id}|${ym}`, s = S.settings.billing[k] || "pendiente";

    const kindTxt = c.kind === "own" ? "Propio · sin tarifa" : c.kind === "internal" ? "No facturable" : billingSummary(c);
    return `<button class="row" data-act="editClient" data-id="${c.id}" style="--c:${c.color}"><span class="em">${esc(c.emoji)}</span><span class="main"><span class="t1" style="display:block">${esc(c.name)}</span><span class="t2" style="display:block">${esc(kindTxt)}</span></span>${needsRate(c) ? `<span class="pill warn">Falta tarifa</span>` : ""}<span class="muted">›</span></button>`;

  if (arch.length) h += `<details class="sec"><summary class="muted" style="cursor:pointer;font-weight:600">Archivados (${arch.length})</summary><div class="list" style="margin-top:10px">${arch.map(row).join("")}</div></details>`;

function billingSummary(c) {
  const b = c.billing || "hourly";
  if (b === "hourly") return num(c.rate) != null ? `Por horas · ${S.hide ? "••" : num(c.rate)} €/h` : "Por horas";
  if (b === "retainer") return `Iguala${num(c.fee) != null ? ` · ${S.hide ? "••" : num(c.fee)} €/mes` : ""}${num(c.includedHours) ? ` · ${num(c.includedHours)} h incluidas` : ""}`;
  if (b === "piece") return `Por pieza${(c.pieces || []).length ? " · " + c.pieces.map(p => p.name).join(", ") : ""}`;
  if (b === "fixed") return `Precio cerrado${num(c.total) != null ? ` · ${S.hide ? "••" : num(c.total)} €` : ""}`;
  return "";
}
function newClient(name) {
  name = (name || "").trim(); if (!name) return null;
  const st = S.settings, n = st.clients.length;
  const c = { id: uid(), name, emoji: EMOJIS[n % EMOJIS.length], color: COLORS[n % COLORS.length], line: "", kind: "paid", billing: "hourly", rate: "", taskRates: {}, fee: "", includedHours: "", pieces: [], total: "", keywords: "", note: "", archived: false, createdAt: Date.now(), lastUsed: Date.now() - 1000 };

  Store.saveSettings(true);
  return c;
}

/* ============ hojas ============ */
let sheetClose = null;
function openSheet(html, mount, onClose) {
  const root = $("#sheet");
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const sc = $("#scrim");
  sc.addEventListener("click", e => { if (e.target === sc) closeSheet(); });
  sheetClose = onClose || null;
  if (mount) mount($(".sheet", root));
  const f = $(".sheet [autofocus]", root) || $(".sheet button, .sheet input", root); if (f && matchMedia("(hover:hover)").matches) f.focus();
}
function closeSheet() { const fn = sheetClose; sheetClose = null; $("#sheet").innerHTML = ""; if (fn) fn(); render(); }
const sheetOpen = () => !!$("#scrim");
const sheetHead = (title, extra = "") => `<div class="sheet-h"><h3>${title}</h3><div class="btns">${extra}<button class="btn sm" data-act="closeSheet">Listo</button></div></div>`;

/* hoja: al parar */
function openStopSheet(id) {
  const draw = () => {
    const e = S.entries[id]; if (!e) return closeSheet();
    const c = clientsById()[e.clientId] || { name: "" };
    return `${sheetHead(`Guardado · ${dur(e.mins)}`)}
      <p class="muted" style="margin-top:-10px">${esc(c.name)}. Si quieres, añade qué hiciste.</p>
      <div class="fields"><div class="f"><span>Tarea</span><div class="chips">${S.settings.tasks.map(t => `<button class="chip" data-st="${esc(t)}" aria-pressed="${e.task === t}">${esc(t)}</button>`).join("")}</div></div>

      ${e.task === "Desplazamiento" ? `<label class="f" for="sKm"><span>Kilómetros</span><input id="sKm" inputmode="decimal" value="${e.km || ""}" placeholder="0"></label>` : ""}</div>`;
  };
  const mount = el => {
    el.addEventListener("click", ev => { const b = ev.target.closest("[data-st]"); if (!b) return; const e = S.entries[id]; e.task = e.task === b.dataset.st ? null : b.dataset.st; Store.putEntry(e); el.innerHTML = draw(); });
    el.addEventListener("input", ev => { const e = S.entries[id]; if (!e) return; if (ev.target.id === "sNote") e.note = ev.target.value; if (ev.target.id === "sKm") e.km = num(ev.target.value) || 0; Local.persist(); });

/* ============ calendario ============ */
async function scanCalendar() {
  const mcp = S.caps.mcp; if (!mcp) return;
  S.cal = { busy: true, list: null, err: "" }; render();
  try {
    const now = new Date(), from = addDays(now, -7);
    const iso = d => `${dkey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
    const res = await mcp.callTool("Google Calendar", "list_events", { startTime: iso(from), endTime: iso(now), orderBy: "startTime", pageSize: 250 });
    const p = res && (res.payload || res.structuredContent) || {};
    const events = Array.isArray(p.events) ? p.events : [];
    const used = new Set(entriesList().map(e => e.calId).filter(Boolean));
    const seen = new Set(S.settings.calSeen);
    const cls = S.settings.clients.filter(c => !c.archived && c.kind !== "internal").map(c => ({ c, keys: [c.name, ...String(c.keywords || "").split(",")].map(norm).map(s => s.trim()).filter(s => s.length >= 3) }));
    const list = [];
    for (const ev of events) {
      if (!ev || !ev.id || !ev.start || !ev.start.dateTime || !ev.end || !ev.end.dateTime || ev.status === "cancelled") continue;
      if (used.has(ev.id) || seen.has(ev.id)) continue;
      const s = new Date(ev.start.dateTime), e = new Date(ev.end.dateTime), mins = (e - s) / 60000;
      if (!(mins > 0) || mins > 16 * 60) continue;
      const sum = norm(ev.summary || "");
      const hit = cls.find(x => x.keys.some(k => sum.includes(k)));
      if (!hit) continue;
      list.push({ id: ev.id, summary: ev.summary || "(sin título)", clientId: hit.c.id, date: dkey(s), start: s.getTime(), mins });
    }
    S.cal = { busy: false, list, err: "" };
  } catch (err) {
    const code = err && err.code;
    S.cal = { busy: false, list: null, err: code === "not_granted" || code === "denied" ? "No has dado permiso para leer el calendario." : code === "server_not_connected" ? "Google Calendar no está conectado en tu cuenta de Claude." : "No se pudo leer el calendario. Inténtalo de nuevo en un rato." };
  }
  render();
}
function calDecide(i, ok) {
  const s = S.cal.list && S.cal.list[i]; if (!s) return;
  if (ok) {
    const c = clientsById()[s.clientId];
    Store.putEntry({ id: uid(), kind: "time", clientId: s.clientId, date: s.date, start: s.start, mins: s.mins, task: null, note: s.summary, km: 0, billable: !!c && c.kind === "paid", src: "calendar", calId: s.id, ts: Date.now() });
  } else {
    S.settings.calSeen = [...S.settings.calSeen, s.id].slice(-300); Store.saveSettings();
  }
  S.cal.list.splice(i, 1);
  if (!S.cal.list.length) S.cal.list = null;
  render();
}

/* ============ archivos ============ */
async function saveFile(filename, data, type) {
  if (S.caps.downloads) {
    try { await S.caps.downloads.save({ filename, data: new Blob([data], { type }) }); return; }
    catch (err) { if (err && (err.code === "dismissed" || err.code === "denied" || err.code === "cancelled")) return; }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch { toast("No se pudo descargar el archivo."); }
}
function exportCsv() {

  entries.push({ id: "demo-" + uid(), demo: true, kind: "expense", clientId: cs[0].id, date: dkey(addDays(new Date(), -6)), amount: 45, note: "Alquiler de flashes", ts: now });
  entries.push({ id: "demo-" + uid(), demo: true, kind: "time", clientId: cs[0].id, date: todayKey(), start: now - 2 * 3600e3, mins: 85, task: "Retoque", note: "Selección y revelado", km: 0, billable: true, src: "demo", ts: now });
  render(); toast("Cargando datos de ejemplo…");
  for (const e of entries) await Store.putEntry(e);
  render(); toast("Datos de ejemplo cargados. Bórralos cuando quieras.");
}
async function clearDemo() {
  const ids = S.settings.clients.filter(c => c.demo).map(c => c.id);
  if (S.timer && ids.includes(S.timer.clientId)) { S.timer = null; Store.saveTimer(); }
  S.settings.clients = S.settings.clients.filter(c => !c.demo); Store.saveSettings(true);
  render();
  for (const e of entriesList().filter(e => e.demo)) await Store.delEntry(e.id);
  render(); toast("Datos de ejemplo borrados");
}

/* ============ eventos ============ */
const ACT = {
  nav: b => { location.hash = b.dataset.v; },
  start: b => { if (lp.fired) { lp.fired = false; return; } startClient(b.dataset.id); },
  pause: pauseTimer, resume: resumeTimer, stop: () => stopTimer(),
  pickTask: openTaskPicker, manual: () => openEntrySheet(),
  editEntry: b => openEntrySheet({ id: b.dataset.id }),
  gap: b => openEntrySheet({ date: b.dataset.d }),
  holidayGaps: () => { S.settings.holidays = [...new Set([...S.settings.holidays, ...gaps()])]; Store.saveSettings(); render(); toast("Marcados como días libres"); },
  ackForgot: () => { if (S.timer) { S.timer.ackAt = Date.now(); Store.saveTimer(); render(); } },
  stoppedEarlier: openStoppedEarlier,
  dismiss: b => { S.dismissed[b.dataset.k] = 1; render(); },
  scanCal: scanCalendar, calOk: b => calDecide(+b.dataset.i, true), calNo: b => calDecide(+b.dataset.i, false), calClose: () => { S.cal.list = null; render(); },
  loadDemo, clearDemo,
  eye: () => { S.hide = !S.hide; try { localStorage.setItem("bitacora:hide", S.hide ? "1" : "0"); } catch {} render(); },
  newClient: () => openSheet(`${sheetHead("Cliente nuevo")}<form class="inline" id="qcForm"><input id="qcName" placeholder="Nombre" autocomplete="off" autofocus aria-label="Nombre del cliente"><button class="btn primary" type="submit">Añadir</button></form>`, el => {
    $("#qcForm", el).onsubmit = ev => { ev.preventDefault(); const c = newClient($("#qcName", el).value); if (c) { $("#sheet").innerHTML = ""; sheetClose = null; render(); toast(`${c.name} añadido`, "Configurar", () => openClientSheet(c.id)); } };
  }),
  editClient: b => openClientSheet(b.dataset.id),
  pomo: b => { S.settings.pomodoro = b.checked; if (S.timer) { S.timer.pomoAnchor = activeMs(S.timer); Store.saveTimer(); } Store.saveSettings(); },
  per: b => { S.report.mode = b.dataset.m; if (b.dataset.m === "range" && !S.report.from) { const [f, t] = periodBounds({ mode: "month", anchor: S.report.anchor }); S.report.from = f; S.report.to = t; } render(); },
  prev: () => { const r = S.report, a = r.anchor; r.anchor = r.mode === "week" ? addDays(a, -7) : new Date(a.getFullYear(), a.getMonth() - 1, 1); render(); },
  next: () => { const r = S.report, a = r.anchor; r.anchor = r.mode === "week" ? addDays(a, 7) : new Date(a.getFullYear(), a.getMonth() + 1, 1); render(); },
  nowPer: () => { S.report.anchor = new Date(); render(); },
  billCycle: b => { const k = b.dataset.k, cur = S.settings.billing[k] || "pendiente"; S.settings.billing[k] = BILL[(BILL.indexOf(cur) + 1) % 3]; Store.saveSettings(); render(); },
  exportCsv, backup,
  aiRun: () => askClaude(""),
  importAsk: () => $("#importFile").click(),
  wipeAsk: () => { $("#wipeBox").innerHTML = `<div class="alert warn"><span class="e">⚠️</span><div class="body"><p>Se borrarán todos tus clientes y registros. No se puede deshacer. ¿Descargas antes una copia?</p><div class="btns"><button class="btn sm" data-act="backup">Descargar copia</button><button class="btn sm danger" data-act="wipeYes">Borrar todo</button><button class="btn sm ghost" data-act="wipeNo">Cancelar</button></div></div></div>`; },
  wipeNo: () => render(),
  wipeYes: async () => { S.timer = null; Store.saveTimer(); await replaceAll(DEFAULTS(), {}); toast("Datos borrados"); },
  delTask: b => { S.settings.tasks.splice(+b.dataset.i, 1); Store.saveSettings(); render(); },
  delLine: b => { S.settings.lines.splice(+b.dataset.i, 1); Store.saveSettings(); render(); },
  workPreset: b => { S.settings.workDays = b.dataset.days.split(",").map(Number); Store.saveSettings(); render(); },
  workDay: b => {
    const d = +b.dataset.d, w = S.settings.workDays;
    if (w.includes(d)) { if (w.length === 1) return toast("Tienes que trabajar al menos un día."); S.settings.workDays = w.filter(x => x !== d); }
    else S.settings.workDays = [...w, d].sort();
    Store.saveSettings(); render();
  },
  delHoliday: b => { S.settings.holidays = S.settings.holidays.filter(d => d !== b.dataset.d); Store.saveSettings(); render(); },
  closeSheet: () => closeSheet()
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.type === "checkbox") return;
  const fn = ACT[b.dataset.act]; if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("input[type=checkbox][data-act]")) { const fn = ACT[t.dataset.act]; if (fn) fn(t, e); return; }
  if (t.dataset.set) {
    const path = t.dataset.set.split("."), st = S.settings;
    const val = t.type === "checkbox" ? t.checked : num(t.value);
    if (t.type !== "checkbox" && val == null && path[0] !== "goals") return;
    if (path.length === 2) st[path[0]][path[1]] = val ?? 0; else st[path[0]] = val;
    Store.saveSettings(); toast("Guardado");
  }
  if (t.id === "rFrom" || t.id === "rTo") { S.report.from = $("#rFrom").value || S.report.from; S.report.to = $("#rTo").value || S.report.to; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "aiQ") S.ai.q = e.target.value; });
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.id === "obForm" || f.id === "ncForm") { const inp = f.querySelector("input"); const c = newClient(inp.value); if (c) { inp.value = ""; render(); toast(`${c.name} añadido`, "Configurar", () => openClientSheet(c.id)); } }
  if (f.id === "taskForm") { const v = $("#taskNew").value.trim(); if (v && !S.settings.tasks.includes(v)) { S.settings.tasks.push(v); Store.saveSettings(); render(); } }
  if (f.id === "lineForm") { const v = $("#lineNew").value.trim(); if (v && !S.settings.lines.includes(v)) { S.settings.lines.push(v); Store.saveSettings(); render(); } }
  if (f.id === "holForm") {
    const a = $("#holNew").value, b = $("#holTo").value || a; if (!a) return;
    const set = new Set(S.settings.holidays); let n = 0;
    for (let d = parseD(a < b ? a : b); dkey(d) <= (a < b ? b : a) && n < 120; d = addDays(d, 1), n++) set.add(dkey(d));
    S.settings.holidays = [...set].sort(); Store.saveSettings(); render();
  }
  if (f.id === "aiForm") { const q = $("#aiQ").value.trim(); if (q) askClaude(q); }
});
$("#importFile").addEventListener("change", async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== "bitacora" || !d.settings || typeof d.entries !== "object") throw 0;
    const n = Object.keys(d.entries).length;
    openSheet(`${sheetHead("Restaurar copia")}<p>La copia tiene ${d.settings.clients.length} clientes y ${n} registros. Sustituirá todo lo que tienes ahora.</p>
      <div class="btns"><button class="btn primary" id="impOk">Restaurar</button></div>`, el => {
      $("#impOk", el).onclick = async () => { $("#sheet").innerHTML = ""; sheetClose = null; toast("Restaurando…"); await replaceAll(d.settings, d.entries); toast("Copia restaurada"); };
    });
  } catch { toast("Ese archivo no es una copia de Bitácora."); }
});

/* pulsación larga = +15 min */
const lp = { t: null, fired: false, x: 0, y: 0 };
document.addEventListener("pointerdown", e => {
  const b = e.target.closest(".cbtn[data-id]"); if (!b || e.button > 0) return;
  lp.fired = false; lp.x = e.clientX; lp.y = e.clientY; clearTimeout(lp.t);
  lp.t = setTimeout(() => { lp.fired = true; add15(b.dataset.id); }, 550);
});
const lpCancel = e => { if (e && e.type === "pointermove" && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) < 10) return; clearTimeout(lp.t); };
["pointerup", "pointercancel", "pointerleave", "pointermove"].forEach(ev => document.addEventListener(ev, lpCancel, { passive: true }));
document.addEventListener("contextmenu", e => { if (e.target.closest(".cbtn")) e.preventDefault(); });

/* teclado */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetOpen()) { closeSheet(); return; }
  const tg = e.target; if (sheetOpen() || e.metaKey || e.ctrlKey || e.altKey || (tg && (tg.matches("input,textarea,select") || tg.isContentEditable))) return;
  if (e.key === " " && S.view === "hoy") {
    e.preventDefault();
    if (S.timer) stopTimer(); else { const c = activeClients()[0]; if (c) startClient(c.id); }
  } else if (/^[1-9]$/.test(e.key) && S.view === "hoy") {
    const c = activeClients()[+e.key - 1]; if (c) startClient(c.id);
  } else if (e.key === "n" || e.key === "N") { e.preventDefault(); openEntrySheet(); }
});

/* rutas */
function route() {
  const h = location.hash.replace("#", "");
  S.view = VIEWS.some(([k]) => k === h) ? h : "hoy";
  if (sheetOpen()) { $("#sheet").innerHTML = ""; sheetClose = null; }
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ============ reloj ============ */
let lastAlertCheck = 0;
function tick(fromRender) {
  const t = S.timer, now = Date.now();
  const c = t && clientsById()[t.clientId];
  const a = activeMs(t, now);
  $$("[data-clock]").forEach(el => { el.textContent = clockStr(a); });
  document.title = t && c ? `${t.pausedAt ? "❚❚" : "▶"} ${clockStr(a).replace(/:\d\d$/, "")} · ${c.name}` : "Bitácora";
  const wb = $("[data-weekbill]");
  if (wb && t && c && c.kind === "paid" && !fromRender) {
    const base = +wb.dataset.weekbill + a / 60000, goal = (num(S.settings.goals.weekHours) || 0) * 60;
    wb.firstChild.textContent = durShort(base);
    const m = wb.parentElement.querySelector(".meter > i"); if (m && goal) m.style.width = clamp(base / goal * 100, 0, 100) + "%";
  }
  const pomo = $("[data-pomo]");
  if (t && S.settings.pomodoro) {
    const work = (num(S.settings.pomoWork) || 25) * 60000, brk = (num(S.settings.pomoBreak) || 5) * 60000;
    if (!t.pausedAt && a - (t.pomoAnchor || 0) >= work) {
      t.pausedAt = now; t.breakUntil = now + brk; Store.saveTimer(); sound("bell");
      toast(`🍅 Pomodoro completo. Descansa ${Math.round(brk / 60000)} min.`); if (!fromRender) render(); return;
    }
    if (t.breakUntil && now >= t.breakUntil) {
      t.breakUntil = null; Store.saveTimer(); sound("bell"); toast("Fin del descanso", "Reanudar", resumeTimer); if (!fromRender) render(); return;
    }
    if (pomo) pomo.textContent = t.breakUntil ? `☕ Descanso · ${clockStr(t.breakUntil - now).slice(2)}` : t.pausedAt ? "" : `🍅 ${clockStr(work - (a - (t.pomoAnchor || 0))).slice(2)}`;
  } else if (pomo) pomo.textContent = "";
  if (!fromRender && t && !t.pausedAt && now - lastAlertCheck > 60000) { lastAlertCheck = now; if (S.view === "hoy" && !sheetOpen() && a > (num(S.settings.forgotHours) || 2) * 3600e3 && !$(".alert.warn")) render(); }
}
setInterval(() => tick(false), 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

/* ============ arranque ============ */
async function boot() {
  const cache = Local.load();
  if (cache) { S.settings = mergeSettings(cache.settings); S.timer = cache.timer || null; S.entries = cache.entries || {}; }
  route();
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") { S.mode = "local"; render(); return; }
  const safe = p => Promise.resolve(p).catch(() => null);
  const [db, user] = await Promise.all([safe(cl.use("db")), safe(cl.use("user"))]);
  const id = user ? await safe(user.id()) : null;
  if (db && id) {
    if (cache && cache.mode === "local") { /* se migra al recibir la nube vacía */ }
    S.mode = "cloud"; Cloud.init(db, id);
  } else { S.mode = "local"; }
  render();
  const [sample, mcp, downloads] = await Promise.all([safe(cl.use("sample")), safe(cl.use("mcp")), safe(cl.use("downloads"))]);
  S.caps = { db, sample, mcp, downloads };
  render();
}
boot();
})();
</script>
